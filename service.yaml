apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
spec:
  type: NodePort
  selector:
    app: jenkins
  ports:
    - name: http         # <-- nama unik untuk port 8080
      port: 8080
      targetPort: 8080
      nodePort: 30080

    - name: agent        # <-- nama unik untuk port 50000
      port: 50000
      targetPort: 50000
      nodePort: 30500
